[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ac"
version = "0.1.0"
description = "Aegis - adaptive, multi-game, learning anti-cheat platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "msgpack>=1.0",
    "zstandard>=0.22",
    "orjson>=3.10",
    "cryptography>=42",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
